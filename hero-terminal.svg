<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="700" height="220" rx="14" fill="url(#bgGrad)"/>

  <line x1="0" y1="34" x2="700" y2="34" stroke="#1f2937" stroke-width="1"/>
  <circle cx="24" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="17" r="6" fill="#27C93F"/>
  <text x="350" y="21" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#6b7280">awais@github — zsh</text>

  <g font-family="Fira Code, Consolas, monospace" font-size="15">
    <text x="24" y="70" opacity="0">
      <tspan fill="#00C9FF">awais@github</tspan><tspan fill="#64748b">:~$ </tspan><tspan fill="#e5e7eb">whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>

    <text x="24" y="102" opacity="0">
      <tspan fill="#64748b">&#8594; </tspan><tspan fill="#7dd3fc">Software Engineer — React Native + Flutter Developer</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
    </text>

    <text x="24" y="134" opacity="0">
      <tspan fill="#00C9FF">awais@github</tspan><tspan fill="#64748b">:~$ </tspan><tspan fill="#e5e7eb">cat stats.log</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
    </text>

    <text x="24" y="166" opacity="0">
      <tspan fill="#64748b">&#8594; </tspan><tspan fill="#00C9FF" font-weight="bold">5,000+ downloads</tspan><tspan fill="#7dd3fc"> | </tspan><tspan fill="#00C9FF" font-weight="bold">3 shipped apps</tspan><tspan fill="#7dd3fc"> | </tspan><tspan fill="#00C9FF" font-weight="bold">open to freelance</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/>
    </text>

    <text x="24" y="198" opacity="0">
      <tspan fill="#00C9FF">awais@github</tspan><tspan fill="#64748b">:~$ </tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
    </text>
  </g>

  <rect x="180" y="184" width="9" height="18" fill="#00C9FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.76;0.9;1" dur="1s" begin="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>
